[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "applemac-price-tracker"
version = "1.0.0"
description = "Tracks MacBook Pro, MacBook Air, and iPhone prices from applemac.pk"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
]

# Dependency groups (PEP 735) for dev tools.
# pytest is in a dependency-group (not optional-dependencies) because `uv sync`
# installs dependency-groups by default, which is required for CI to have pytest
# available. If moved to optional-dependencies, `uv sync` would skip it unless
# --extra or --all-extras is passed, and the CI test gate would fail silently
# (pytest would not be found on a clean ubuntu-latest runner).
[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real network; deselected by default",
]
addopts = "-m \"not live\""
